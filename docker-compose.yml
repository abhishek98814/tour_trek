services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: treknepal
      POSTGRES_USER: treknepal
      POSTGRES_PASSWORD: treknepal_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treknepal"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./trek_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./trek_backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./trek_backend/.env
    environment:
      DB_NAME: treknepal
      DB_USER: treknepal
      DB_PASSWORD: treknepal_dev_password
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./trek_frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./trek_frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      API_URL: http://backend:8000/api
      NEXT_PUBLIC_MEDIA_URL: http://localhost:8000
    depends_on:
      - backend

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend


volumes:
  pgdata:
  ollama_data: